name: Secret archive validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x
      - name: Validate archive and app configuration on .NET 10
        shell: pwsh
        run: |
          $env:AQ_TEST_FIXTURE = Join-Path $env:RUNNER_TEMP 'cross-framework.aqsecrets'
          $env:AQ_TEST_WRITE_FIXTURE = '1'
          dotnet test AQ.SecretArchive.Tests/AQ.SecretArchive.Tests.csproj -f net10.0 --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read the .NET 10 archive using .NET 6
        shell: pwsh
        run: |
          $env:AQ_TEST_FIXTURE = Join-Path $env:RUNNER_TEMP 'cross-framework.aqsecrets'
          dotnet test AQ.SecretArchive.Tests/AQ.SecretArchive.Tests.csproj -f net6.0 --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build app with migrated credential consumers
        run: dotnet build AutopilotQuick/AutopilotQuick.csproj --configuration Release
      - name: Publish administrator tool
        run: dotnet publish AQ.SecretArchive.Tool/AQ.SecretArchive.Tool.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/secret-archive-tool
      - uses: actions/upload-artifact@v4
        with:
          name: AQ-SecretArchive-Tool
          path: artifacts/secret-archive-tool
